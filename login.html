<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Shiv Shakti Tuition</title>
  <link rel="icon" type="image/png" href="./logo.png">
<link rel="apple-touch-icon" href="./logo.png">


  <!-- Premium Font & Google Material Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" rel="stylesheet" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
      background: var(--bg-color, #f8fafc);
      color: var(--text-main, #1e293b);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 410px;
      background: #ffffff;
      border-radius: 20px;
      padding: 32px 28px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border, #e2e8f0);
    }

    .logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 16px;
      border-radius: 16px;
      background: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border: 1px solid var(--border, #e2e8f0);
    }

    .logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 6px;
    }

    .brand-title {
      text-align: center;
      font-size: 12px;
      font-weight: 700;
      color: #f59e0b;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    h1 {
      margin: 0 0 4px;
      text-align: center;
      color: var(--primary, #0a1d3f);
      font-size: 24px;
      font-weight: 700;
    }

    .subtitle {
      text-align: center;
      color: var(--text-muted, #64748b);
      margin: 0 0 28px;
      font-size: 14px;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      color: var(--text-main, #1e293b);
      font-weight: 600;
      font-size: 13px;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      height: 48px;
      border: 1px solid var(--border, #cbd5e1);
      border-radius: 10px;
      padding: 0 16px;
      font-size: 15px;
      background: #fff;
      font-family: 'Inter', sans-serif;
      color: var(--text-main, #1e293b);
      transition: 0.2s;
    }

    input:focus {
      outline: none;
      border-color: var(--primary, #0a1d3f);
      box-shadow: 0 0 0 3px rgba(10, 29, 63, 0.1);
    }

    .password-box {
      position: relative;
      display: flex;
      align-items: center;
    }

    .password-box input {
      padding-right: 48px;
    }

    .show-password {
      position: absolute;
      right: 12px;
      background: transparent;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted, #64748b);
    }

    .remember-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 10px 0 22px;
      color: var(--text-main, #1e293b);
      font-size: 14px;
      cursor: pointer;
      font-weight: 500;
    }

    .remember-row input {
      width: 18px;
      height: 18px;
      accent-color: var(--primary, #0a1d3f);
      cursor: pointer;
    }

    #loginBtn {
      width: 100%;
      height: 50px;
      border: none;
      border-radius: 10px;
      background: var(--primary, #0a1d3f);
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: 0.2s;
      box-shadow: 0 4px 6px -1px rgba(10, 29, 63, 0.2);
    }

    #loginBtn:hover {
      background: #163262;
    }

    #loginBtn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    #loginMessage {
      min-height: 22px;
      margin-top: 16px;
      text-align: center;
      font-size: 14px;
      font-weight: 500;
    }

    .error {
      color: #ef4444;
    }

    .success {
      color: #10b981;
    }

    .footer {
      text-align: center;
      color: var(--text-muted, #94a3b8);
      font-size: 12px;
      margin-top: 24px;
      font-weight: 500;
    }
  </style>
</head>

<body>

  <div class="login-card">

    <div class="logo">
      <img src="./logo.png" alt="Shiv Shakti Tuition Logo">
    </div>

    <div class="brand-title">Shiv Shakti Tuition</div>
    <h1>Staff Portal</h1>
    <div class="subtitle">
      Secure Management System
    </div>


    <form id="loginForm">

      <div class="field">
        <label for="loginId">Staff ID</label>
        <input
          type="text"
          id="loginId"
          placeholder="Enter your Staff ID"
          autocomplete="username"
          required
        >
      </div>


      <div class="field">
        <label for="loginPassword">Password</label>
        <div class="password-box">
          <input
            type="password"
            id="loginPassword"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >
          <button
            type="button"
            class="show-password"
            id="showPassword"
            aria-label="Show password"
          >
            <span class="material-symbols-rounded" style="font-size: 20px;">visibility</span>
          </button>
        </div>
      </div>


      <label class="remember-row">
        <input
          type="checkbox"
          id="rememberMe"
        >
        <span>Remember Me</span>
      </label>


      <button
        type="submit"
        id="loginBtn"
      >
        <span class="material-symbols-rounded" style="font-size: 18px;">lock_open</span> Login
      </button>

    </form>


    <div id="loginMessage"></div>


    <div class="footer">
      Authorized Staff Access Only
    </div>

  </div>


  <script type="module" src="./login.js"></script>

</body>
</html>
