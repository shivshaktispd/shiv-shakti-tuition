<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reports - Shiv Shakti Tuition</title>

  <!-- Premium Font & Google Material Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" rel="stylesheet" />

  <!-- Global & Separate Reports CSS -->
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./reports.css">
  <link rel="icon" type="image/png" href="./logo.png">
<link rel="apple-touch-icon" href="./logo.png">

</head>

<body>

  <main class="report-page">
    <div class="brand-title">Shiv Shakti Tuition</div>

    <header class="report-header">
      <div>
        <h1><span class="material-symbols-rounded">bar_chart</span> Institute Reports</h1>
        <p>Analyze attendance and fee collection records</p>
      </div>
      <button type="button" class="btn-outline" onclick="window.location.href='index.html'" style="padding: 10px 16px; border-radius: 30px; background: white; border: 1px solid var(--border); cursor: pointer; font-weight: 600;">
        ← Back
      </button>
    </header>

    <section class="report-card">
      <h2 style="font-size: 18px; color: var(--primary); margin-bottom: 15px;">Select Report Category</h2>
      <div class="report-buttons">
        <button onclick="window.showAttendanceReport()">
          <span class="material-symbols-rounded">calendar_month</span> Attendance Report
        </button>
        <button onclick="window.showFeesReport()">
          <span class="material-symbols-rounded">payments</span> Fees Report
        </button>
      </div>
    </section>

    <section id="reportArea">
      <div class="report-card empty-report">
        <span class="material-symbols-rounded" style="font-size: 40px; color: var(--text-muted); margin-bottom: 10px;">analytics</span>
        <h3>No Report Selected</h3>
        <p>Upar diye gaye buttons mein se koi report select karein.</p>
      </div>
    </section>
  </main>

  <script type="module" src="reports.js"></script>

</body>
</html>
